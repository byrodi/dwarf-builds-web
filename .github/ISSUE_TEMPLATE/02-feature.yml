name: Feature request
description: Suggest a change or a new capability for the site
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and why the site gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How it could work. A sketch or a screenshot helps.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds or other sites you tried.
