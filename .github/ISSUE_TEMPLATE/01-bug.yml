name: Bug report
description: Something looks wrong or does not work on the site
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Search [existing issues](https://github.com/byrodi/dwarf-builds-web/issues?q=is%3Aissue) first. Security problems go to a [private report](https://github.com/byrodi/dwarf-builds-web/security/advisories/new), not here. Problems inside the game belong to the [mod repository](https://github.com/byrodi/dwarf-builds-drg/issues).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead. Screenshots help; drag them in here.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open https://dwarfbuilds.pages.dev/...
        2. Click ...
        3. ...
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Page
      description: The address of the page, for example a build link.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser
      description: Browser and version, or the Steam overlay.
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console errors
      description: Errors from the browser console (F12), if any. It is formatted as code automatically.
      render: shell
